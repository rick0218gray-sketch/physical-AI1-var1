# ハードウェア不要のチェックだけを行う(ROS 2 / Gazebo / GPU / Ollama は使わない)。
# ロボット上での動作・学習・LLM の実測は対象外。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = ROS 2 Humble (Ubuntu 22.04) の Python
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies (pytest, numpy)
        run: python -m pip install -r requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q nl_commander crane_act tests
      - name: Shell syntax check
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Tests
        run: python -m pytest -q
